services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    env_file:
      - path: ./backend/.env
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_storage:
