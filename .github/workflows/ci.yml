name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache piano transcription checkpoint and torch cache
        uses: actions/cache@v4
        with:
          path: |
            ~/piano_transcription_inference_data
            ~/.cache/torch
          key: ${{ runner.os }}-model-cache-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-model-cache-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fluidsynth

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26.4,<2.0" scipy cython mido "setuptools<81"
          pip install --no-build-isolation -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
